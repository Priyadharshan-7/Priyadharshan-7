<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f" />
      <stop offset="50%" stop-color="#0d1124" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <!-- Animated Neon Border Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF; #7928CA; #FF007A; #00F5FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA; #FF007A; #00F5FF; #7928CA" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF007A">
        <animate attributeName="stop-color" values="#FF007A; #00F5FF; #7928CA; #FF007A" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Frosted Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    .grid-line { stroke: #00F5FF; stroke-width: 0.5; opacity: 0.12; }
    .neon-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      letter-spacing: 4px;
      fill: #FFFFFF;
    }
    .sub-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      fill: #00F5FF;
      letter-spacing: 3px;
    }
    .tag-pill {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      fill: #E0E6ED;
      font-weight: 600;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Cyber Grid Lines -->
  <line x1="0" y1="90" x2="1200" y2="90" class="grid-line" />
  <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
  <line x1="0" y1="270" x2="1200" y2="270" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
  <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="180" r="120" fill="#00F5FF" opacity="0.12" filter="url(#neonBlur)">
    <animate attributeName="cx" values="200; 300; 200" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="180" r="140" fill="#7928CA" opacity="0.15" filter="url(#neonBlur)">
    <animate attributeName="cx" values="1000; 900; 1000" dur="12s" repeatCount="indefinite" />
  </circle>

  <!-- Glassmorphism Card Frame -->
  <rect x="80" y="45" width="1040" height="270" rx="20" fill="url(#glassGrad)" stroke="url(#neonGlow)" stroke-width="2" />

  <!-- Glowing Accent Corner brackets -->
  <path d="M 80 85 L 80 45 L 120 45" fill="none" stroke="#00F5FF" stroke-width="4" />
  <path d="M 1080 45 L 1120 45 L 1120 85" fill="none" stroke="#FF007A" stroke-width="4" />
  <path d="M 80 275 L 80 315 L 120 315" fill="none" stroke="#7928CA" stroke-width="4" />
  <path d="M 1080 315 L 1120 315 L 1120 275" fill="none" stroke="#00F5FF" stroke-width="4" />

  <!-- Name & Title -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <text class="neon-text" font-size="52" y="0">PRIYADHARSHAN</text>
    <text class="sub-text" y="45">[ B.TECH INFORMATION TECHNOLOGY ]</text>
    <text font-family="'Segoe UI', sans-serif" font-size="16" fill="#94A3B8" y="85">
      SOFTWARE DEV • FLUTTER • ARTIFICIAL INTELLIGENCE • CYBERSECURITY
    </text>
  </g>

  <!-- Interactive/Status Badges in SVG -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <!-- Status Pill -->
    <rect x="-190" y="-18" width="180" height="34" rx="17" fill="#00F5FF" fill-opacity="0.15" stroke="#00F5FF" stroke-width="1.2"/>
    <circle cx="-168" cy="-1" r="5" fill="#00F5FF">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-95" y="4" class="tag-pill" fill="#00F5FF">OPEN FOR COLLABS</text>

    <!-- Location Pill -->
    <rect x="10" y="-18" width="180" height="34" rx="17" fill="#7928CA" fill-opacity="0.15" stroke="#7928CA" stroke-width="1.2"/>
    <text x="100" y="4" class="tag-pill" fill="#E2E8F0">PORTFOLIO v2.0</text>
  </g>
</svg>
