<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-labelledby="t">
<title id="t">Animated developer status panel</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10152E"/><stop offset="1" stop-color="#21133D"/></linearGradient><linearGradient id="s"><stop stop-color="#65F4F0"/><stop offset="1" stop-color="#C084FC"/></linearGradient><filter id="b"><feGaussianBlur stdDeviation="3"/></filter></defs>
<rect x="3" y="3" width="434" height="294" rx="22" fill="url(#g)" stroke="url(#s)" stroke-opacity=".8"/>
<text x="26" y="37" font-family="monospace" font-size="12" fill="#65F4F0" letter-spacing="2">DEVELOPER / STATUS</text>
<circle cx="398" cy="31" r="5" fill="#86EFAC"><animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
<g font-family="monospace" font-size="13" fill="#CBD5E1">
<text x="27" y="76">CREATIVITY</text><text x="360" y="76" fill="#65F4F0">ACTIVE</text>
<rect x="27" y="88" width="386" height="7" rx="3.5" fill="#29314B"/><rect x="27" y="88" width="310" height="7" rx="3.5" fill="url(#s)"><animate attributeName="width" values="260;340;310;260" dur="7s" repeatCount="indefinite"/></rect>
<text x="27" y="128">LEARNING MODE</text><text x="330" y="128" fill="#C4B5FD">CONTINUOUS</text>
<rect x="27" y="140" width="386" height="7" rx="3.5" fill="#29314B"/><rect x="27" y="140" width="350" height="7" rx="3.5" fill="#8B5CF6"><animate attributeName="width" values="320;370;350;320" dur="6s" repeatCount="indefinite"/></rect>
<text x="27" y="180">BUILD CYCLE</text><text x="350" y="180" fill="#F472B6">ITERATE</text>
<rect x="27" y="192" width="386" height="7" rx="3.5" fill="#29314B"/><rect x="27" y="192" width="280" height="7" rx="3.5" fill="#F472B6"><animate attributeName="width" values="230;330;280;230" dur="8s" repeatCount="indefinite"/></rect>
</g>
<path d="M27 222H413" stroke="#64748B" stroke-opacity=".5"/>
<g font-family="monospace" font-size="11" fill="#94A3B8">
<text x="27" y="247">FOCUS</text><text x="27" y="270" font-size="14" fill="#E2E8F0">AI / ML · APPS · SOFTWARE</text>
<text x="27" y="287" fill="#65F4F0">[ <tspan><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>●</tspan> ] ready for next commit</text>
</g>
</svg>