<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">3D Neon Developer Dashboard</title>
<desc id="desc">Animated perspective grid, glowing orbs, floating glass panels, and a futuristic developer title.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B1C"/><stop offset=".5" stop-color="#171038"/><stop offset="1" stop-color="#061C2A"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65F4F0"/><stop offset=".48" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
  <radialGradient id="orb"><stop stop-color="#65F4F0" stop-opacity=".55"/><stop offset="1" stop-color="#65F4F0" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#65F4F0" stroke-opacity=".16" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="330" rx="24" fill="url(#bg)"/>
<rect width="1200" height="330" rx="24" fill="url(#grid)" opacity=".6"/>
<ellipse cx="210" cy="75" rx="220" ry="150" fill="url(#orb)"><animate attributeName="cx" values="210;280;210" dur="9s" repeatCount="indefinite"/></ellipse>
<ellipse cx="1030" cy="250" rx="250" ry="180" fill="#8B5CF6" opacity=".15"><animate attributeName="cy" values="250;210;250" dur="8s" repeatCount="indefinite"/></ellipse>
<g transform="translate(760 38) skewY(-8)" opacity=".9">
  <rect x="0" y="0" width="330" height="190" rx="18" fill="#0A1027" fill-opacity=".72" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M0 42H330" stroke="#65F4F0" stroke-opacity=".4"/>
  <circle cx="22" cy="21" r="4" fill="#F472B6"/><circle cx="38" cy="21" r="4" fill="#FBBF24"/><circle cx="54" cy="21" r="4" fill="#65F4F0"/>
  <g font-family="monospace" font-size="13" fill="#CBD5E1">
    <text x="20" y="72" fill="#65F4F0">const</text><text x="65" y="72"> developer = {</text>
    <text x="34" y="98" fill="#C084FC">build:</text><text x="90" y="98"> "something useful",</text>
    <text x="34" y="124" fill="#C084FC">learn:</text><text x="90" y="124"> "every day",</text>
    <text x="34" y="150" fill="#C084FC">status:</text><text x="90" y="150" fill="#86EFAC"> "shipping"</text>
    <text x="20" y="176">};</text>
  </g>
  <animateTransform attributeName="transform" type="translate" values="760 38;760 28;760 38" dur="6s" repeatCount="indefinite" additive="replace"/>
</g>
<g transform="translate(865 250)" filter="url(#glow)">
  <circle r="27" fill="#8B5CF6" fill-opacity=".2" stroke="#C084FC" stroke-width="1.5"/>
  <ellipse rx="53" ry="17" fill="none" stroke="#65F4F0" stroke-width="1.4" transform="rotate(-25)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></ellipse>
  <ellipse rx="53" ry="17" fill="none" stroke="#F472B6" stroke-width="1.4" transform="rotate(55)"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/></ellipse>
  <circle r="6" fill="#65F4F0"><animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/></circle>
</g>
<g fill="none" stroke="url(#edge)" stroke-width="1.4" opacity=".8">
  <path d="M45 250L110 220L170 250L110 280Z"><animate attributeName="opacity" values=".35;1;.35" dur="4s" repeatCount="indefinite"/></path>
  <path d="M110 220V280M45 250H170"/>
  <path d="M610 40l12 22 25 4-18 17 4 25-23-12-23 12 4-25-18-17 25-4z" opacity=".55"><animateTransform attributeName="transform" type="rotate" from="0 610 75" to="360 610 75" dur="30s" repeatCount="indefinite"/></path>
</g>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="62" y="92" font-size="13" letter-spacing="5" fill="#65F4F0">PERSONAL DEVELOPER INTERFACE</text>
  <text x="58" y="151" font-size="43" font-weight="800" fill="#F8FAFC">PRIYADHARSHAN</text>
  <text x="61" y="194" font-size="23" font-weight="600" fill="#C4B5FD">Software • AI/ML • Flutter</text>
  <rect x="62" y="219" width="246" height="36" rx="18" fill="#0D182D" stroke="url(#edge)"/>
  <circle cx="80" cy="237" r="4" fill="#86EFAC"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="94" y="242" font-size="12" letter-spacing="2" fill="#E2E8F0">SYSTEM ONLINE · READY TO BUILD</text>
</g>
<path d="M24 298H1176" stroke="url(#edge)" stroke-opacity=".6"/>
<g fill="#65F4F0"><circle cx="350" cy="45" r="2"><animate attributeName="cy" values="45;85;45" dur="5s" repeatCount="indefinite"/></circle><circle cx="690" cy="270" r="2"><animate attributeName="cy" values="270;235;270" dur="4s" repeatCount="indefinite"/></circle><circle cx="720" cy="110" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle></g>
</svg>