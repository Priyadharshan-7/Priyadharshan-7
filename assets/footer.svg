<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="t">
<title id="t">Animated neon footer</title>
<defs><linearGradient id="line"><stop stop-color="#65F4F0" stop-opacity="0"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="110" rx="18" fill="#0B1020"/>
<path d="M0 55H1200" stroke="url(#line)" stroke-width="2"/>
<path d="M0 55H1200" stroke="#65F4F0" stroke-opacity=".5" stroke-width="1" stroke-dasharray="8 18"><animate attributeName="stroke-dashoffset" from="0" to="-104" dur="5s" repeatCount="indefinite"/></path>
<g font-family="monospace" text-anchor="middle">
<text x="600" y="43" font-size="12" letter-spacing="6" fill="#94A3B8">KEEP EXPLORING · KEEP BUILDING</text>
<text x="600" y="79" font-size="22" font-weight="700" fill="#E2E8F0">ONE COMMIT AT A TIME <tspan fill="#65F4F0">✦</tspan><animate attributeName="opacity" values="1;.72;1" dur="3s" repeatCount="indefinite"/></text>
</g>
<circle cx="85" cy="55" r="4" fill="#65F4F0"><animate attributeName="cy" values="55;40;55" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="1115" cy="55" r="4" fill="#F472B6"><animate attributeName="cy" values="55;70;55" dur="4s" repeatCount="indefinite"/></circle>
</svg>